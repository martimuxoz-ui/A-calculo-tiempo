<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora de tiempo</title>
</head>
<body>
    <div class="row justify-content-center mt-3 mx-0">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card tarjeta">
                <div class="card-body">

                    <div class="row justify-content-center">
                        <div class="col-6">
                            <h6 class="card-title titulo">CALCULADORA DE TIEMPO</h6>
                        </div>
                    </div>
                    <div class="row mt-4">
                        <span class="subtitulos">INTRODUCE LA HORA INICIAL :</span>
                    </div>
                    <div class="row">
                        <div class="col-4">
                            <span class="titulotiempo">Hora</span>
                            <input onchange="verificartiempo(this, 23)" type="number" id="hi" min="0" max="23" class="form-control" placeholder="00">
                        </div>
                        <div class="col-4">
                            <span class="titulotiempo">Minutos</span>
                            <input onchange="verificartiempo(this, 59)" type="number" id="mi" min="0" max="59" class="form-control" placeholder="00">
                        </div>
                        <div class="col-4">
                            <span class="titulotiempo">Segundos</span>
                            <input onchange="verificartiempo(this, 59)" type="number" id="si" min="0" max="59" class="form-control" placeholder="00">
                        </div>
                    </div>
                    <div class="row mt-4">
                        <span class="subtitulos">INTRODUCE LA HORA FINAL :</span>
                    </div>
                    <div class="row">
                        <div class="col-4">
                            <span class="titulotiempo">Hora</span>
                            <input onchange="verificartiempo(this, 23)" type="number" id="hf" min="0" max="23" class="form-control" placeholder="00">
                        </div>
                        <div class="col-4">
                            <span class="titulotiempo">Minutos</span>
                            <input onchange="verificartiempo(this, 59)" type="number" id="mf" min="0" max="59" class="form-control" placeholder="00">
                        </div>
                        <div class="col-4">
                            <span class="titulotiempo">Segundos</span>
                            <input onchange="verificartiempo(this, 59)" type="number" id="sf" min="0" max="59" class="form-control" placeholder="00">
                        </div>
                    </div>
                    <div class="row mt-3 justify-content-center">
                        <div class="col-6 col-md-5">
                            <button type="button" class="btn-calcular" onclick="calcularTiempo()">REALIZAR CALCULO</button>
                        </div>
                    </div>
                    <div class="row justify-content-center">
                        <div class="col-6 col-md-5">
                            <button type="button" class="btn-reiniciar" onclick="reiniciar()">REINICIAR CALCULO</button>
                        </div>
                    <div class="row mt-4">
                        <span class="subtitulos">RESULTADO</span>
                    </div>
                    <div class="row">
                        <div class="col-4">
                            <span class="titulotiempo">Hora</span>
                            <input type="number" class="form-control" id="resultadoHoras" placeholder="00" readonly>
                        </div>
                        <div class="col-4">
                            <span class="titulotiempo">Minutos</span>
                            <input type="number" class="form-control" id="resultadoMinutos" placeholder="00" readonly>
                        </div>
                        <div class="col-4">
                            <span class="titulotiempo">Segundos</span>
                            <input type="number" class="form-control" id="resultadoSegundos" placeholder="00" readonly>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="codigo.js"></script>
</body>
</html>
